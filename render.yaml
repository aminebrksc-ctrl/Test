services:
  - type: web
    name: starmah-bot
    runtime: python
    plan: free
    buildCommand: python -m compileall -q app.py
    startCommand: python app.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ALLOWED_USER_IDS
        value: ""
      - key: TEXT_MODEL
        value: gpt-4.1-mini
      - key: IMAGE_MODEL
        value: gpt-image-1.5
      - key: DAILY_TEXT_LIMIT
        value: "100"
      - key: DAILY_IMAGE_LIMIT
        value: "5"
